<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday GEAAA!</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050002;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            transition: opacity 1.5s ease-in-out;
        }

        #matrixCanvas {
            z-index: 1;
            opacity: 1;
        }

        #starCanvas {
            z-index: 2;
            opacity: 0;
            background-color: #080a13;
        }

        .screen {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease-in-out;
            width: 100%;
            height: 100%;
        }

        .screen.active {
            opacity: 1;
            visibility: visible;
        }

        /* --- MUSIC PLAYER --- */
        #musicPlayer {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(20, 5, 15, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 105, 180, 0.3);
            border-radius: 50px;
            padding: 8px 16px 8px 8px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            box-shadow: 0 0 20px rgba(216, 27, 96, 0.2);
        }

        #musicPlayer.show {
            opacity: 1;
            visibility: visible;
        }

        #btnMusicToggle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #d81b60, #ff1493);
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 10px rgba(216, 27, 96, 0.5);
            flex-shrink: 0;
        }

        #btnMusicToggle:hover {
            transform: scale(1.1);
            box-shadow: 0 0 18px rgba(255, 20, 147, 0.7);
        }

        .music-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .music-title {
            font-size: 0.7rem;
            font-weight: 600;
            color: #ffb6c1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 130px;
        }

        .music-status {
            font-size: 0.6rem;
            color: rgba(255, 182, 193, 0.6);
        }

        .equalizer {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 14px;
            margin-left: 4px;
        }

        .equalizer span {
            display: block;
            width: 3px;
            background: #ff69b4;
            border-radius: 2px;
            height: 4px;
            animation: none;
        }

        .equalizer.playing span:nth-child(1) { animation: eq 0.8s ease-in-out infinite; }
        .equalizer.playing span:nth-child(2) { animation: eq 0.6s ease-in-out infinite 0.15s; }
        .equalizer.playing span:nth-child(3) { animation: eq 0.9s ease-in-out infinite 0.05s; }
        .equalizer.playing span:nth-child(4) { animation: eq 0.7s ease-in-out infinite 0.25s; }

        @keyframes eq {
            0%, 100% { height: 4px; }
            50% { height: 14px; }
        }

        .volume-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .volume-icon {
            font-size: 0.75rem;
            color: rgba(255, 182, 193, 0.7);
        }

        #volumeSlider {
            -webkit-appearance: none;
            appearance: none;
            width: 60px;
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 105, 180, 0.3);
            outline: none;
            cursor: pointer;
        }

        #volumeSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff1493;
            cursor: pointer;
        }

        /* --- SCREEN 1: LANDING --- */
        .gift-icon {
            font-size: 5rem;
            animation: bounce 2s infinite;
            margin-bottom: 15px;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }

        .landing-title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #ffb6c1;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
        }

        .btn-action {
            padding: 12px 35px;
            font-size: 1.2rem;
            background: #d81b60;
            color: #fff;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(216, 27, 96, 0.6);
            z-index: 20;
        }

        .btn-action:hover {
            background: #ff1493;
            transform: translateY(-3px);
        }

        /* --- SCREEN 2: COUNTDOWN --- */
        #timerText {
            font-size: 8rem;
            font-weight: 600;
            color: #ff69b4;
            text-shadow: 0 0 20px rgba(255, 20, 147, 0.8);
            text-align: center;
            line-height: 1.2;
            transition: color 0.3s ease, text-shadow 0.3s ease;
        }

        @keyframes popNumber {
            0%   { transform: scale(0.3); opacity: 0; }
            60%  { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(1);   opacity: 1; }
        }

        .number-pop {
            animation: popNumber 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pulseTimer {
            0%   { transform: scale(1);   opacity: 0.8; }
            50%  { transform: scale(1.1); opacity: 1;   }
            100% { transform: scale(1);   opacity: 0.8; }
        }

        /* Progress bar */
        #countdownBar {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 260px;
            height: 6px;
            background: rgba(255, 105, 180, 0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        #countdownBarFill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ff1493, #ff69b4);
            border-radius: 10px;
            transition: width 0.9s linear;
        }

        #countdownLabel {
            position: absolute;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: rgba(255, 182, 193, 0.7);
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .bday-text {
            font-family: 'Dancing Script', cursive;
            font-size: 4.5rem;
            animation: none !important;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.8), 0 0 20px #ff1493;
        }
        /* Animasi kata bergantian */
        @keyframes wordSlideIn {
            0%   { transform: scale(0.5) translateY(30px); opacity: 0; }
            60%  { transform: scale(1.1) translateY(-5px);  opacity: 1; }
            100% { transform: scale(1)   translateY(0);     opacity: 1; }
        }

        .word-animate {
            font-family: 'Poppins', sans-serif;
            font-size: 6rem;
            font-weight: 600;
            letter-spacing: 8px;
            color: #ff1493;
            text-shadow: 0 0 30px rgba(255, 20, 147, 0.8);
            animation: wordSlideIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* --- SCREEN 3: GIF --- */
        .gif-container {
            animation: popInScale 1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .gif-container img {
            width: 280px;
            max-width: 90vw;
        }

        @keyframes popInScale {
            0%   { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- SCREEN 4: FLIP BOOK --- */
        .message-box {
            background-color: #fff;
            color: #a46d5b;
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            padding: 15px 35px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: slideDown 1s ease forwards;
            opacity: 0;
            transform: translateY(-30px);
            z-index: 5;
        }

        .instruction-text {
            font-size: 1.1rem;
            color: #ffb6c1;
            margin-bottom: 15px;
            animation: float 2s infinite ease-in-out, slideDown 1s ease 0.5s forwards;
            opacity: 0;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        @keyframes float {
            0%   { transform: translateY(0px); }
            50%  { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .album-container {
            width: 150px;
            height: 220px;
            perspective: 1500px;
            position: relative;
            transition: transform 1s ease;
            animation: slideUp 1s ease 0.5s forwards;
            opacity: 0;
            transform: translateY(30px);
            z-index: 10;
        }

        .album-container.open {
            transform: translateX(75px) translateY(0) !important;
        }

        .page {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: left;
            transform-style: preserve-3d;
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
            cursor: pointer;
        }

        .page.flipped { transform: rotateY(-180deg); }

        #p1 { z-index: 4; }
        #p2 { z-index: 3; }
        #p3 { z-index: 2; }
        #p4 { z-index: 1; }

        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 5px 15px 15px 5px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1), 2px 5px 10px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .back {
            transform: rotateY(180deg);
            border-radius: 15px 5px 5px 15px;
        }

        .front.cover {
            background: linear-gradient(45deg, #a46d5b, #8a5a4a);
            color: white;
            font-family: 'Dancing Script', cursive;
            font-size: 2.2rem;
            border-left: 10px solid #5a382b;
            padding: 0;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .front img, .back img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 3px;
        }

        #btnNextToHeart {
            margin-top: 30px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
        }

        #btnNextToHeart.show {
            opacity: 1;
            visibility: visible;
        }

        @keyframes slideDown {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- SCREEN 5: HEART COLLAGE --- */
        .heart-grid {
            display: grid;
            grid-template-columns: repeat(5, min(17vw, 65px));
            grid-template-rows: repeat(4, min(17vw, 65px));
            gap: 5px;
        }

        .heart-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 20, 147, 0.3);
            opacity: 0;
            transform: scale(0);
        }

        .heart-grid img.show-img {
            animation: popIn 0.5s forwards;
        }

        .p1  { grid-area: 1 / 2; }
        .p2  { grid-area: 1 / 4; }
        .p3  { grid-area: 2 / 1; }
        .p4  { grid-area: 2 / 2; }
        .p5  { grid-area: 2 / 3; }
        .p6  { grid-area: 2 / 4; }
        .p7  { grid-area: 2 / 5; }
        .p8  { grid-area: 3 / 2; }
        .p9  { grid-area: 3 / 3; }
        .p10 { grid-area: 3 / 4; }
        .p11 { grid-area: 4 / 3; }

        @keyframes popIn {
            0%   { transform: scale(0);   opacity: 0; }
            80%  { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1);   opacity: 1; }
        }

        .final-text {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: #ffb6c1;
            margin-top: 20px;
            text-align: center;
            opacity: 0;
            transition: opacity 1s ease-in;
        }

        .final-text.show-text { opacity: 1; }
    </style>
</head>
<body>

    <!-- AUDIO — ganti src dengan link lagu favorit Geaa -->
    <audio id="bgMusic" loop>
        <source src="Paint My Love.mp3" type="audio/mpeg">
    </audio>

    <!-- MUSIC PLAYER -->
    <div id="musicPlayer">
        <button id="btnMusicToggle" title="Play/Pause Musik">▶</button>
        <div class="music-info">
            <span class="music-title" id="musicTitle">Happy Birthday 🎵</span>
            <span class="music-status" id="musicStatus">Klik ▶ untuk play</span>
        </div>
        <div class="equalizer" id="equalizer">
            <span></span><span></span><span></span><span></span>
        </div>
        <div class="volume-wrapper">
            <span class="volume-icon">🔊</span>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.7">
        </div>
    </div>

    <!-- CANVAS BACKGROUND -->
    <canvas id="matrixCanvas"></canvas>
    <canvas id="starCanvas"></canvas>

    <!-- SCREEN 1: LANDING -->
    <div class="screen active" id="landingScreen">
        <div class="gift-icon">🎁</div>
        <h1 class="landing-title">Ada Kejutan Buatmu!</h1>
        <button class="btn-action" id="btnStart">Buka Kejutan</button>
    </div>

    <!-- SCREEN 2: COUNTDOWN 10 → 1 -->
    <div class="screen" id="timerScreen">
        <div id="timerText">10</div>
        <span id="countdownLabel">Bersiap...</span>
        <div id="countdownBar">
            <div id="countdownBarFill"></div>
        </div>
    </div>

    <!-- SCREEN 3: GIF -->
    <div class="screen" id="gifScreen">
        <div class="gif-container">
            <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExeWY2amxwbTk0NTc4ZnlrNG9iN2pyYXZ1MTluZHQ5aTBwNGdmeHQ3byZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/kaMwwM91UCxstRfvA3/giphy.gif" alt="Happy Birthday GIF">
        </div>
    </div>

    <!-- SCREEN 4: FLIP BOOK -->
    <div class="screen" id="frameScreen">
        <div class="message-box">Happy Birthday GEAAA 🤎</div>
        <p class="instruction-text" id="albumInstruction">Ketuk Bukunya!</p>

        <div class="album-container" id="albumContainer">
            <div class="page" id="p4">
                <div class="front"><img src="foto/foto6.jpeg" alt="Foto 6"></div>
                <div class="back"></div>
            </div>
            <div class="page" id="p3">
                <div class="front"><img src="foto/foto4.jpeg" alt="Foto 4"></div>
                <div class="back"><img src="foto/foto5.jpeg" alt="Foto 5"></div>
            </div>
            <div class="page" id="p2">
                <div class="front"><img src="foto/foto2.jpeg" alt="Foto 2"></div>
                <div class="back"><img src="foto/foto10.jpeg" alt="Foto 10"></div>
            </div>
            <div class="page" id="p1">
                <div class="front cover">Buka Aku</div>
                <div class="back"><img src="foto/foto11.jpeg" alt="Foto 11"></div>
            </div>
        </div>

        <button class="btn-action" id="btnNextToHeart">Lihat Kejutan Terakhir</button>
    </div>

    <!-- SCREEN 5: HEART COLLAGE -->
    <div class="screen" id="heartScreen">
        <div class="heart-grid" id="heartGrid">
            <img src="foto/foto1.jpeg"  class="p1"  alt="img">
            <img src="foto/foto2.jpeg"  class="p2"  alt="img">
            <img src="foto/foto3.jpeg"  class="p3"  alt="img">
            <img src="foto/foto4.jpeg"  class="p4"  alt="img">
            <img src="foto/foto5.jpeg"  class="p5"  alt="img">
            <img src="foto/foto6.jpeg"  class="p6"  alt="img">
            <img src="foto/foto7.jpeg"  class="p7"  alt="img">
            <img src="foto/foto8.jpeg"  class="p8"  alt="img">
            <img src="foto/foto9.jpeg"  class="p9"  alt="img">
            <img src="foto/foto10.jpeg" class="p10" alt="img">
            <img src="foto/foto11.jpeg" class="p11" alt="img">
        </div>
        <h2 class="final-text" id="finalText">We Love You!</h2>
    </div>

    <script>
        // =============================================
        // MUSIC PLAYER
        // =============================================
        const bgMusic        = document.getElementById('bgMusic');
        const btnMusicToggle = document.getElementById('btnMusicToggle');
        const musicPlayer    = document.getElementById('musicPlayer');
        const musicStatus    = document.getElementById('musicStatus');
        const equalizer      = document.getElementById('equalizer');
        const volumeSlider   = document.getElementById('volumeSlider');

        bgMusic.volume = 0.7;
        let isPlaying = false;

        function showMusicPlayer() { musicPlayer.classList.add('show'); }

        function playMusic() {
            bgMusic.play().then(() => {
                isPlaying = true;
                btnMusicToggle.textContent = '⏸';
                musicStatus.textContent = 'Sedang diputar...';
                equalizer.classList.add('playing');
            }).catch(err => console.log('Autoplay blocked:', err));
        }

        function pauseMusic() {
            bgMusic.pause();
            isPlaying = false;
            btnMusicToggle.textContent = '▶';
            musicStatus.textContent = 'Dijeda';
            equalizer.classList.remove('playing');
        }

        btnMusicToggle.addEventListener('click', () => { isPlaying ? pauseMusic() : playMusic(); });
        volumeSlider.addEventListener('input', (e) => { bgMusic.volume = e.target.value; });

        // =============================================
        // MATRIX ANIMATION
        // =============================================
        const matrixCanvas = document.getElementById('matrixCanvas');
        const mCtx = matrixCanvas.getContext('2d');
        matrixCanvas.width  = window.innerWidth;
        matrixCanvas.height = window.innerHeight;

        const characters = "HAPPYBIRTHDAYGEA123456789".split("");
        const fontSize = 16;
        const columns  = matrixCanvas.width / fontSize;
        const drops    = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            mCtx.fillStyle = "rgba(0, 0, 0, 0.08)";
            mCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            mCtx.fillStyle = "#ff1493";
            mCtx.font = fontSize + "px monospace";
            for (let i = 0; i < drops.length; i++) {
                const text = characters[Math.floor(Math.random() * characters.length)];
                mCtx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > matrixCanvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            }
        }
        let matrixInterval = setInterval(drawMatrix, 50);

        // =============================================
        // STARFIELD ANIMATION
        // =============================================
        const starCanvas = document.getElementById('starCanvas');
        const sCtx = starCanvas.getContext('2d');
        starCanvas.width  = window.innerWidth;
        starCanvas.height = window.innerHeight;

        const stars = [];
        for (let i = 0; i < 150; i++) {
            stars.push({
                x: Math.random() * starCanvas.width,
                y: Math.random() * starCanvas.height,
                radius: Math.random() * 1.5,
                alpha: Math.random(),
                speed: Math.random() * 0.02
            });
        }

        function drawStars() {
            sCtx.clearRect(0, 0, starCanvas.width, starCanvas.height);
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
                sCtx.beginPath();
                sCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                sCtx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
                sCtx.fill();
            });
            requestAnimationFrame(drawStars);
        }

        window.addEventListener('resize', () => {
            matrixCanvas.width  = window.innerWidth;
            matrixCanvas.height = window.innerHeight;
            starCanvas.width    = window.innerWidth;
            starCanvas.height   = window.innerHeight;
        });

        // =============================================
        // SCREEN TRANSITIONS
        // =============================================
        const btnStart        = document.getElementById('btnStart');
        const btnNextToHeart  = document.getElementById('btnNextToHeart');
        const landingScreen   = document.getElementById('landingScreen');
        const timerScreen     = document.getElementById('timerScreen');
        const gifScreen       = document.getElementById('gifScreen');
        const frameScreen     = document.getElementById('frameScreen');
        const heartScreen     = document.getElementById('heartScreen');
        const timerText       = document.getElementById('timerText');
        const barFill         = document.getElementById('countdownBarFill');
        const countdownLabel  = document.getElementById('countdownLabel');
        const finalText       = document.getElementById('finalText');

        function switchScreen(hideElem, showElem) {
            hideElem.classList.remove('active');
            setTimeout(() => showElem.classList.add('active'), 800);
        }

        // Animasi pop saat angka berganti
        function setTimerNumber(num) {
            timerText.classList.remove('number-pop');
            void timerText.offsetWidth; // reflow trick
            timerText.innerText = num;
            timerText.classList.add('number-pop');
        }

        // =============================================
        // COUNTDOWN 10 → 1 → Happy Birthday!
        // =============================================
        const TOTAL = 10;

        btnStart.addEventListener('click', () => {
            showMusicPlayer();
            playMusic();
            switchScreen(landingScreen, timerScreen);

            let count = TOTAL;
            barFill.style.width = '100%';
            setTimerNumber(count);

            const countdown = setInterval(() => {
                count--;

                if (count > 0) {
                    // Update angka dengan animasi pop
                    setTimerNumber(count);

                    // Progress bar menyusut
                    barFill.style.width = (count / TOTAL * 100) + '%';

                    // Angka 3, 2, 1 berubah warna merah sebagai peringatan
                    if (count <= 3) {
                        timerText.style.color       = '#ff0040';
                        timerText.style.textShadow  = '0 0 30px rgba(255,0,64,0.9)';
                    } else {
                        timerText.style.color       = '#ff69b4';
                        timerText.style.textShadow  = '0 0 20px rgba(255,20,147,0.8)';
                    }

                } else if (count === 0) {
                    barFill.style.width = '0%';
                    countdownLabel.style.display = 'none';

                    const words = ["HAPPY", "BIRTHDAY", "TO", "GEAA", "❤️"];
                    const totalDuration = words.length * 900 + 500;
                    let wordIndex = 0;

                    timerText.classList.remove('number-pop', 'bday-text');
                    timerText.style.color      = '';
                    timerText.style.textShadow = '';

                    function showNextWord() {
                        if (wordIndex < words.length) {
                            timerText.classList.remove('word-animate');
                            void timerText.offsetWidth;
                            timerText.innerText = words[wordIndex];
                            timerText.classList.add('word-animate');
                            wordIndex++;
                            setTimeout(showNextWord, 900);
                        }
                    }
                    showNextWord();

                    // Pindah layar setelah semua kata selesai tampil
                    setTimeout(() => {
                        clearInterval(countdown);
                        switchScreen(timerScreen, gifScreen);

                        setTimeout(() => {
                            drawStars();
                            starCanvas.style.opacity   = '1';
                            matrixCanvas.style.opacity = '0';
                            setTimeout(() => clearInterval(matrixInterval), 1500);
                            setTimeout(() => switchScreen(gifScreen, frameScreen), 3500);
                        }, 800);
                    }, totalDuration);

                } else {
                    // Blok ini sekarang kosong karena sudah ditangani di atas
                }
            }, 1000);
        });

        // =============================================
        // FLIP BOOK
        // =============================================
        const albumContainer   = document.getElementById('albumContainer');
        const albumInstruction = document.getElementById('albumInstruction');
        const flipPages = [
            document.getElementById('p1'),
            document.getElementById('p2'),
            document.getElementById('p3')
        ];
        let currentFlip = 0;

        albumContainer.addEventListener('click', () => {
            if (currentFlip === 0) albumContainer.classList.add('open');

            if (currentFlip < flipPages.length) {
                const pageToFlip = flipPages[currentFlip];
                pageToFlip.classList.add('flipped');
                const flipIndex = currentFlip;
                setTimeout(() => { pageToFlip.style.zIndex = 10 + flipIndex; }, 300);
                currentFlip++;

                if (currentFlip < flipPages.length) {
                    albumInstruction.innerText = "Ketuk lagi untuk halaman selanjutnya!";
                } else {
                    albumInstruction.innerText = "Ciee, lucu banget!";
                    setTimeout(() => btnNextToHeart.classList.add('show'), 1000);
                }
            }
        });

        // =============================================
        // HEART COLLAGE
        // =============================================
        btnNextToHeart.addEventListener('click', () => {
            switchScreen(frameScreen, heartScreen);
            const heartImages = document.querySelectorAll('.heart-grid img');

            setTimeout(() => {
                heartImages.forEach((img, index) => {
                    setTimeout(() => img.classList.add('show-img'), index * 200);
                });
                setTimeout(() => finalText.classList.add('show-text'), heartImages.length * 200 + 500);
            }, 800);
        });
    </script>
</body>
</html>
